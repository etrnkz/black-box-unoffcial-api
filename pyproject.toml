[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox-unofficial-api"
version = "0.1.0"
description = "Unofficial Python API client for blackbox.ai"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[project.scripts]
blackbox = "blackbox.cli:main"


[tool.setuptools.packages.find]
where = ["src"]
